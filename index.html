<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RabahDj</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0b1220; --glass: rgba(255, 255, 255, 0.08); }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        /* تأثير الزجاج - Glassmorphism */
        .glass-card { 
            background: var(--glass); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; 
            padding: 20px; 
            margin: 15px;
        }

        .screen { display: none; padding-bottom: 80px; }
        .active { display: block; }

        .nav-bar { 
            position: fixed; bottom: 0; width: 100%; display: flex; 
            justify-content: space-around; padding: 15px 0; 
            background: rgba(22, 32, 51, 0.9); backdrop-filter: blur(10px);
        }

        button { 
            background: #2563eb; border: none; color: white; 
            padding: 10px 20px; border-radius: 12px; cursor: pointer; 
        }
        
        input { 
            background: #1e293b; border: 1px solid #334155; 
            padding: 10px; border-radius: 10px; color: white; width: 80%; 
        }
    </style>
</head>
<body>

    <!-- الشاشة الرئيسية -->
    <div id="home" class="screen active">
        <div class="glass-card">
            <h1>مرحباً بك في RabahDj</h1>
            <input id="roomInput" placeholder="رقم الغرفة">
            <button onclick="initConnection()">اتصال</button>
        </div>
    </div>

    <!-- صفحة الإعدادات -->
    <div id="settings" class="screen">
        <div class="glass-card">
            <h1>الإعدادات</h1>
            <button onclick="changePassword()">تغيير كلمة مرور الأدمن</button>
            <button onclick="go('home')">رجوع</button>
        </div>
    </div>

    <!-- الشريط السفلي -->
    <div class="nav-bar">
        <button onclick="go('home')">الرئيسية</button>
        <button onclick="adminLogin()">الإعدادات</button>
    </div>

    <script>
        // --- منطق الأدمن ---
        if (!localStorage.getItem('adminPass')) localStorage.setItem('adminPass', '1234');

        function go(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function adminLogin() {
            const input = prompt("أدخل كلمة مرور الأدمن:");
            if (input === localStorage.getItem('adminPass')) go('settings');
            else alert("كلمة مرور غير صحيحة");
        }

        function changePassword() {
            const oldPass = prompt("أدخل كلمة المرور الحالية:");
            if (oldPass === localStorage.getItem('adminPass')) {
                const newPass = prompt("أدخل كلمة المرور الجديدة:");
                if (newPass) {
                    localStorage.setItem('adminPass', newPass);
                    alert("تم تحديث كلمة المرور");
                }
            } else alert("كلمة المرور الحالية غير صحيحة");
        }

        // --- منطق الاتصال ---
        let peer;
        let connections = [];

        function initConnection() {
            const room = document.getElementById('roomInput').value;
            if (!room) return alert("يرجى إدخال رقم الغرفة");
            peer = new Peer('rabah-' + room);
            peer.on('open', (id) => alert("تم الاتصال بنجاح!"));
            peer.on('connection', (conn) => connections.push(conn));
        }

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
</body>
</html>
