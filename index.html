<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RabahDj</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0b1220; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding-bottom: 80px; }
        
        /* الرأس */
        header { text-align: center; padding: 30px 20px; }
        header h1 { font-size: 2rem; color: #2563eb; margin: 0; }
        
        /* الشبكة (Grid) */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .card { 
            background: rgba(255,255,255,0.05); padding: 20px; border-radius: 20px; 
            text-align: center; cursor: pointer; transition: 0.3s;
        }
        .card:active { transform: scale(0.95); }
        .icon { font-size: 30px; margin-bottom: 10px; display: block; }

        /* شريط التنقل السفلي */
        .nav-bar { 
            position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; 
            padding: 15px 0; background: #162033; backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <header>
        <h1>RabahDj</h1>
        <p>شبكتك الاجتماعية المحلية</p>
    </header>

    <div class="grid">
        <div class="card" style="border-top: 4px solid #ef4444;" onclick="alert('سينما')">
            <span class="icon">🎬</span> السينما
        </div>
        <div class="card" style="border-top: 4px solid #8b5cf6;" onclick="alert('بث مباشر')">
            <span class="icon">📡</span> بث مباشر
        </div>
        <div class="card" style="border-top: 4px solid #22c55e;" onclick="alert('تخاطب')">
            <span class="icon">🎙️</span> تخاطب
        </div>
        <div class="card" style="border-top: 4px solid #3b82f6;" onclick="alert('شات')">
            <span class="icon">💬</span> محادثات
        </div>
        <div class="card" style="border-top: 4px solid #f59e0b; grid-column: span 2;" onclick="alert('ألعاب')">
            <span class="icon">🎮</span> الألعاب
        </div>
    </div>

    <div class="nav-bar">
        <button onclick="adminLogin()">⚙️ الإعدادات</button>
        <button onclick="alert('بحث')">🔍 بحث</button>
        <button onclick="alert('مستخدمون')">👥 مستخدمون</button>
        <button onclick="window.location.reload()">🏠 الرئيسية</button>
    </div>

    <script>
        // منطق الأدمن الأساسي
        if (!localStorage.getItem('adminPass')) localStorage.setItem('adminPass', '1234');

        function adminLogin() {
            const input = prompt("كلمة مرور الأدمن:");
            if (input === localStorage.getItem('adminPass')) {
                const newPass = prompt("أدخل كلمة المرور الجديدة (أو إلغاء):");
                if (newPass) localStorage.setItem('adminPass', newPass);
            } else alert("خطأ");
        }

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
</body>
</html>
