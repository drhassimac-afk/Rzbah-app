<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RabahDj</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { background: #0b1220; color: #fff; font-family: sans-serif; margin: 0; padding: 0; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; padding: 15px 0; background: #162033; }
        .screen { padding: 20px; display: none; }
        .active { display: block; }
        button { cursor: pointer; }
    </style>
</head>
<body>

    <div id="home" class="screen active">
        <h1>الرئيسية</h1>
        <button onclick="adminLogin()">دخول الإعدادات (الأدمن)</button>
    </div>

    <div id="settings" class="screen">
        <h1>الإعدادات</h1>
        <button onclick="changePassword()">تغيير كلمة مرور الأدمن</button>
        <button onclick="go('home')">رجوع</button>
    </div>

    <div class="nav-bar">
        <button onclick="go('home')">الرئيسية</button>
        <button onclick="adminLogin()">الإعدادات</button>
    </div>

    <script>
        // تهيئة كلمة السر الافتراضية
        if (!localStorage.getItem('adminPass')) {
            localStorage.setItem('adminPass', '1234');
        }

        function go(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function adminLogin() {
            const input = prompt("أدخل كلمة مرور الأدمن:");
            if (input === localStorage.getItem('adminPass')) {
                go('settings');
            } else {
                alert("كلمة مرور غير صحيحة");
            }
        }

        function changePassword() {
            const oldPass = prompt("أدخل كلمة المرور الحالية:");
            if (oldPass === localStorage.getItem('adminPass')) {
                const newPass = prompt("أدخل كلمة المرور الجديدة:");
                if (newPass) {
                    localStorage.setItem('adminPass', newPass);
                    alert("تم تحديث كلمة المرور");
                }
            } else {
                alert("كلمة المرور الحالية غير صحيحة");
            }
        }

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
</body>
</html>
