<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RabahDj</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="logo">
      <h1>Rabah<span>Dj</span></h1>
      <div class="underline-logo"></div>
      <p class="slogan">شبكتك الاجتماعية المحلية</p>
    </div>
  </header>

  <!-- ===== INFO BAR ===== -->
  <div class="info-bar">
    <i class="fa fa-wifi-slash" style="color:#aaa"></i>
    <p>اتصل، شارك، وابث صوتاً وفيديو مع أصدقاء</p>
  </div>
  <div class="info-bar sub">
    <p>عبر شبكتك المحلية بدون إنترنت</p>
  </div>

  <!-- ===== GRID ===== -->
  <main class="grid">

    <a href="pages/live.html" class="card purple">
      <div class="card-icon">
        <i class="fa fa-podcast"></i>
      </div>
      <span>بث مباشر</span>
    </a>

    <a href="pages/cinema.html" class="card darkred">
      <div class="card-icon">
        <i class="fa fa-film"></i>
      </div>
      <span>سينما وتلفاز</span>
    </a>

    <a href="pages/walkie.html" class="card green">
      <div class="card-icon">
        <i class="fa fa-microphone"></i>
      </div>
      <span>تخاطب لاسلكي</span>
    </a>

    <a href="pages/chat.html" class="card blue">
      <div class="card-icon">
        <i class="fa fa-comment-dots"></i>
      </div>
      <span>محادثات فورية</span>
    </a>

    <a href="pages/files.html" class="card orange">
      <div class="card-icon">
        <i class="fa fa-folder-open"></i>
      </div>
      <span>مشاركة ملفات</span>
    </a>

    <a href="pages/games.html" class="card teal">
      <div class="card-icon">
        <i class="fa fa-gamepad"></i>
      </div>
      <span>ألعاب جماعية</span>
    </a>

  </main>

  <!-- ===== BOTTOM NAV ===== -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <i class="fa fa-home"></i>
      <span>الرئيسية</span>
    </a>
    <a href="pages/profile.html" class="nav-item">
      <i class="fa fa-user"></i>
      <span>ملفي</span>
    </a>
    <a href="pages/nearby.html" class="nav-item center-btn">
      <i class="fa fa-wifi"></i>
    </a>
    <a href="pages/notifications.html" class="nav-item">
      <i class="fa fa-bell"></i>
      <span>إشعارات</span>
    </a>
    <a href="pages/settings.html" class="nav-item">
      <i class="fa fa-cog"></i>
      <span>الإعدادات</span>
    </a>
  </nav>

  <script src="js/app.js"></script>
</body>
</html>
